 ["def","Enriqueta compra estos productos directamente a ___ productores.","los",B,"unos"],
 ["def","…excepto ___ azúcar, que lo compra a una ONG.","el",B,"un"],
 ["def","___ galletas de Enriqueta están hechas con productos ecológicos.","Las",B,"Unas"],
 ["def","Trabaja con ___ granjeros del sur de Brasil.","unos",B,"los"],
 ["def","…y ___ leche, que es de su propia granja.","la",B,"una"],
 ["def","Enriqueta es ___ amiga mía que tiene una tienda.","una","la",B],

 ["pose","Enriqueta compra ___ estos productos directamente.",B,"los","unos"],
 ["pose","En ___ su tienda no solo vende galletas.",B,"la","una"],
 ["pose","La leche es de ___ su propia granja.",B,"la","una"],
 ["pose","Seguramente la conocéis: es ___ tienda de galletas de la Avenida de la Libertad.","la","una",B]
];

var LETTERS = ["A","B","C","D","E"];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

var deck = [], pos = 0, right = 0, answered = false, wrong = [], cur = null;

function header() {
  var n = deck.length, pct = n ? Math.round(100 * pos / n) : 0;
  $("head").innerHTML = n && pos < n
    ? '<div class="bar"><div style="width:' + pct + '%"></div></div><div class="stat">Вопрос <b>' + (pos + 1) + '</b> из ' + n + ' · верно: <b>' + right + '</b></div>'
    : '<div class="stat">' + BANK.length + ' вопросов по ' + countGroups() + ' темам из трёх разборов</div>';
}
function countGroups() { var n = 0; for (var k in RULES) n++; return n; }

function startScreen() {
  deck = []; header();
  var saved = store("err_wrong"), sv = saved ? saved.split(",") : [];
  var h = '<div class="start"><p>Вопросы перемешаны. На каждую ошибку — несколько разных заданий. После ответа — правило.</p>';
  h += '<button class="big" onclick="begin(20)">20 вопросов</button>';
  h += '<button class="big light" onclick="begin(50)">50 вопросов</button>';
  h += '<button class="big light" onclick="begin(0)">Все ' + BANK.length + '</button>';
  if (sv.length && sv[0] !== "") h += '<button class="big light" onclick="beginWrong()">Повторить мои ошибки (' + sv.length + ')</button>';
  h += '</div><h2>Темы</h2><table class="topics">';
  for (var k in RULES) h += '<tr><td>•</td><td>' + RULES[k][0] + '</td></tr>';
  $("app").innerHTML = h + '</table>';
}

function build(idx) {
  deck = [];
  for (var i = 0; i < idx.length; i++) {
    var it = BANK[idx[i]], opts = [];
    for (var j = 2; j < it.length; j++) opts.push({ t: it[j], ok: j === 2 });
    deck.push({ id: idx[i], g: it[0], q: it[1], opts: shuffle(opts), c: it[2] });
  }
  pos = 0; right = 0; wrong = []; render();
}
function begin(n) {
  var all = []; for (var i = 0; i < BANK.length; i++) all.push(i);
  shuffle(all); build(n ? all.slice(0, n) : all);
}
function beginWrong() {
  var sv = (store("err_wrong") || "").split(","), idx = [];
  for (var i = 0; i < sv.length; i++) { var n = parseInt(sv[i], 10); if (n >= 0 && n < BANK.length) idx.push(n); }
  build(shuffle(idx));
}

function render() {
  answered = false; header();
  if (pos >= deck.length) { result(); return; }
  cur = deck[pos];
  var h = '<div class="chip">' + RULES[cur.g][0] + '</div><p class="q">' + esc(cur.q).replace(/___/g, '<span class="gap">&nbsp;</span>') + '</p>';
  for (var i = 0; i < cur.opts.length; i++)
    h += '<button class="choice" id="c' + i + '" onclick="pick(' + i + ')"><span class="L">' + LETTERS[i] + '</span>' + esc(cur.opts[i].t) + '</button>';
  $("app").innerHTML = h + '<div id="fb"></div>';
}

function pick(k) {
  if (answered) return; answered = true;
  var ok = cur.opts[k].ok;
  for (var i = 0; i < cur.opts.length; i++) {
    var b = $("c" + i); b.disabled = true;
    b.className = "choice " + (cur.opts[i].ok ? "right" : (i === k ? "wrong" : "dim"));
  }
  if (ok) right++; else wrong.push({ id: cur.id, q: cur.q, c: cur.c, y: cur.opts[k].t });
  var last = pos === deck.length - 1;
  $("fb").innerHTML = '<div class="explain"><span class="verdict">' + (ok ? "✓ Верно" : "✗ Правильно: " + esc(cur.c)) + '</span>' + RULES[cur.g][1] + '</div>' +
    '<button class="big" onclick="next()">' + (last ? "Результат" : "Дальше →") + '</button>';
  header();
}
function next() { pos++; render(); window.scrollTo(0, 0); }

function fill(q, c) {
  if (q.indexOf("___") < 0) return esc(c);
  var parts = c.indexOf(" … ") >= 0 ? c.split(" … ") : [c], k = 0;
  return esc(q).replace(/___/g, function () { var p = parts[Math.min(k++, parts.length - 1)]; return "<b>" + (p.indexOf("—") === 0 ? "(—)" : esc(p)) + "</b>"; });
}

function result() {
  var n = deck.length, ids = [];
  for (var i = 0; i < wrong.length; i++) ids.push(wrong[i].id);
  store("err_wrong", ids.join(","));
  var pct = Math.round(100 * right / n);
  var h = '<div class="score">' + right + '<span> / ' + n + '</span></div><p>' + pct + '% верно. ' +
    (pct >= 85 ? "Отлично — эти ошибки уходят." : pct >= 60 ? "Хорошо. Повтори ошибки ниже." : "Есть над чем поработать — пройди ошибки ещё раз.") + '</p>';
  if (wrong.length) {
    h += '<button class="big" onclick="beginWrong()">Повторить ошибки (' + wrong.length + ')</button><h2>Разбор</h2>';
    for (var j = 0; j < wrong.length; j++)
      h += '<div class="rv">' + fill(wrong[j].q, wrong[j].c) + '<div class="yours">Ваш ответ: ' + esc(wrong[j].y) + '</div></div>';
  }
  h += '<button class="big light" onclick="startScreen()">В начало</button>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

startScreen();
</script>
</body>
</html>
